# Carpeta configurable de datos; no es la carpeta del proyecto Java.
aadtex.data-root=C:/workspace/store_data
# Valores: cron (por defecto), fixed-rate. Se ejecuta una sola modalidad.
aadtex.scheduler.mode=cron
aadtex.scheduler.cron=*/5 * * * * *
# En producción: aadtex.scheduler.cron=0 0 3 * * *
aadtex.generator.enabled=true
